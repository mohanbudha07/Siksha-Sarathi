<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:40px;
        }

        .container{
            width:450px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.15);
        }

        h2{
            text-align:center;
            color:#333;
        }

        label{
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

        .result{
            margin-top:25px;
            padding:15px;
            background:#d4edda;
            border:1px solid #28a745;
            border-radius:5px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:#155724;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Predict Student Performance</h2>

<form method="POST">

<label>Attendance (%)</label>
<input type="number" name="attendance" step="0.1" min="0" max="100" required>

<label>Assignment Score</label>
<input type="number" name="assignment" step="0.1" min="0" max="100" required>

<label>Quiz Score</label>
<input type="number" name="quiz" step="0.1" min="0" max="100" required>

<label>Study Hours</label>
<input type="number" name="study_hours" step="0.1" min="0" required>

<button type="submit">
Predict Performance
</button>

</form>

{% if prediction %}

<div class="result">
Predicted Performance: {{ prediction }}
</div>

{% endif %}

<br>

<a href="{{ url_for('student_dashboard') }}">
← Back to Dashboard
</a>

</div>

</body>
</html>
